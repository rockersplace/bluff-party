<style>
  :root{
    --bg-1:#eef1f8;
    --bg-2:#e2e8f7;

    --accent-ink:#ffffff;
    --panel:#eef1fb;
    --card:#ffffff;
    --text:#26314c;
    --muted:#8892ab;
    --border:#e3e7f3;
    --border-strong:#d7dcee;
    --danger:#e05a3a;
    --danger-bg:#fdeee9;
    --correct-bg:#fff3e7;
    --radius:22px;
    --radius-sm:14px;
    --pill:999px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-1) 100%);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0;
  }
  .wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
    width:100%;
    padding:28px 18px 40px;
  }
  .brand{
    text-align:center;
    margin-bottom:22px;
  }
  .brand .mark{
    font-size:30px;
    font-weight:800;
    color:var(--heading);
    line-height:1.15;
  }
  .brand .mark .accent{ color:var(--accent); }
  .brand .sub{
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.14em;
    margin-top:4px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:14px;
    box-shadow:0 12px 30px rgba(40,50,90,0.06);
  }
  .panel{
    background:var(--panel);
    border-radius:var(--radius);
    padding:6px;
    margin-bottom:14px;
  }
  .panel .card{ margin-bottom:0; box-shadow:none; }
  label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
  }
  input[type=text]{
    width:100%;
    background:#f6f7fc;
    border:1px solid var(--border-strong);
    border-radius:var(--pill);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-size:16px;
    padding:14px 20px;
    margin-bottom:14px;
    outline:none;
  }
  textarea{
    width:100%;
    background:#f6f7fc;
    border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-size:16px;
    padding:14px 16px;
    margin-bottom:14px;
    outline:none;
    resize:vertical;
    min-height:80px;
    line-height:1.4;
  }
  input[type=text]:focus, textarea:focus{ border-color:var(--accent); }
  button{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:15px;
    border:none;
    border-radius:var(--pill);
    padding:14px 18px;
    cursor:pointer;
    width:100%;
    transition:transform .08s ease, opacity .15s ease;
  }
  button:active{ transform:scale(0.98); }
  button.primary{ background:var(--accent); color:var(--accent-ink); }
  button.secondary{ background:#f6f7fc; color:var(--text); border:1px solid var(--border-strong); }
  button.danger{ background:var(--danger-bg); color:var(--danger); border:1px solid #f6d9cd; }
  button:disabled{ opacity:.45; cursor:default; }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  .players{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px; }
  .chip{
    display:flex; align-items:center; gap:6px;
    background:var(--panel); border-radius:20px; padding:6px 12px 6px 6px;
    font-size:13px;
  }
  .avatar{
    width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px; font-weight:700; color:#fff;
    background:var(--accent);
    flex-shrink:0;
  }
  .chip.selectable{
    cursor:pointer;
    border:1px solid var(--border-strong);
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .chip.selectable.active{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  .round-btn{ width:auto; flex:1; }
  .round-btn.active{ background:var(--accent); color:var(--accent-ink); }
  .muted{ color:var(--muted); font-size:13px; }
  .hint{ color:var(--muted); font-size:12px; line-height:1.5; margin-top:6px;}
  .confirm{ color:var(--accent); font-size:13px; font-weight:600; margin-top:6px; }
  .question{
    font-weight:600;
    font-size:19px;
    line-height:1.45;
    color:var(--text);
    margin:8px 0 16px;
  }
  .option-card{
    position:relative;
    background:#f6f7fc;
    border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    margin-bottom:12px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .option-card:hover{ border-color:var(--accent); }
  .option-card.selected{ border-color:var(--accent); background:var(--correct-bg); }
  .option-card.correct{ border-color:var(--accent); background:var(--correct-bg); }
  .option-card.wrong-picked{ border-color:var(--danger); background:var(--danger-bg); }
  .option-card .stamp{
    position:absolute; top:10px; right:12px;
    font-size:10px; font-weight:700; letter-spacing:.08em;
    padding:3px 8px; border-radius:6px;
  }
  .stamp.wahr{ background:var(--accent); color:#fff; }
  .stamp.erfunden{ background:var(--danger); color:#fff; }
  .option-text{ font-size:15px; line-height:1.4; padding-right:60px; }
  .option-meta{ font-size:11px; color:var(--muted); margin-top:8px; }
  .scoreboard-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .scoreboard-row:last-child{ border-bottom:none; }
  .scoreboard-row .pts{ font-weight:700; color:var(--accent); }
  .progress{ font-size:12px; color:var(--muted); margin-top:10px; }
  .error{ color:var(--danger); font-size:13px; margin-bottom:10px; min-height:16px; }
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px; font-size:12px; color:var(--muted);
  }
  .topbar .code{ color:var(--accent); font-weight:700; letter-spacing:.15em; }
  .install-hint{
    margin-top:auto;
    padding-top:18px;
    font-size:11px;
    color:var(--muted);
    line-height:1.5;
    text-align:center;
  }
</style>

const CATEGORIES = ['Kuriosität', 'Wahr oder falsch?', 'Schräges Ereignis', 'Unbekanntes Wort'];
function questionCategory(q){ return q.cat || 'Kuriosität'; }

// ---------- Firebase Setup ----------
const isConfigured = !!firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("DEIN_");
let app = null, db = null, auth = null;
if(isConfigured){
  app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);
}

function ensureAuth(){
  return new Promise((resolve, reject)=>{
    if(!auth){ reject(new Error("Firebase nicht konfiguriert")); return; }
    if(auth.currentUser){ resolve(auth.currentUser); return; }
    const unsub = onAuthStateChanged(auth, user=>{
      if(user){ unsub(); resolve(user); }
    }, err=>{ unsub(); reject(err); });
    signInAnonymously(auth).catch(err=>{ unsub(); reject(err); });
  });
}

function roomRef(){ return doc(db, 'rooms', me.code); }
function playersCol(){ return collection(db, 'rooms', me.code, 'players'); }
function submissionsCol(){ return collection(db, 'rooms', me.code, 'submissions'); }
function votesCol(){ return collection(db, 'rooms', me.code, 'votes'); }
function subDocId(round, pid){ return `${round}_${pid}`; }

function initialGame(){
  return { phase:"lobby", round:0, questionIndex:null, usedQuestions:[], options:null, totalRounds:null, tally:null, votes:null, correctIdx:null };
}

// Ändert den Spielzustand nur, wenn er noch in der erwarteten Phase ist.
// Wichtig, weil mehrere Geräte gleichzeitig denselben automatischen
// Phasenwechsel auslösen können (alle sehen "alle fertig" im selben Moment) -
// die Transaktion sorgt dafür, dass nur der erste Versuch etwas schreibt.
async function transitionPhase(expectedPhase, buildPatch){
  await runTransaction(db, async (tx)=>{
    const snap = await tx.get(roomRef());
    const data = snap.data();
    if(!data || data.game.phase !== expectedPhase) return;
    const patch = buildPatch(data.game, data.scores || {});
    if(patch) tx.update(roomRef(), patch);
  });
}

// ---------- Helpers ----------
function loadOrCreateId(){
  try{
    const stored = localStorage.getItem('bluffpartyspiel_pid');
    if(stored) return stored;
    const id = uid();
    localStorage.setItem('bluffpartyspiel_pid', id);
    return id;
  }catch(e){ return uid(); }
}
// Merkt sich Name+Raumcode, damit ein Handy, das die Seite neu lädt (z.B.
// weil der mobile Browser den Tab im Hintergrund verwirft), automatisch
// wieder in denselben Raum kommt statt zum leeren Anmeldebildschirm
// zurückgeworfen zu werden.
function loadStoredRoom(){
  try{
    const raw = localStorage.getItem('bluffpartyspiel_room');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveStoredRoom(name, code){
  try{ localStorage.setItem('bluffpartyspiel_room', JSON.stringify({name, code})); }catch(e){}
}
function clearStoredRoom(){
  try{ localStorage.removeItem('bluffpartyspiel_room'); }catch(e){}
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function makeCode(){
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  let c=""; for(let i=0;i<4;i++) c+=letters[Math.floor(Math.random()*letters.length)];
  return c;
}
function initials(name){
  return (name||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const root = document.getElementById('root');

let joined = false;
let unsubscribers = [];
let localAnswerDraft = "";
let errorMsg = "";
let lobbyRoundsDraft = 8;
let lobbyCategoriesDraft = [...CATEGORIES];
let cache = { players: [], game: null, scores: {}, submissions: [], votes: [], hostId: null };

// Fallback für Räume, die vor Einführung der Spielleitung erstellt wurden
// (das gespeicherte Firestore-Dokument hat dann kein hostId-Feld) - sonst
// würde niemand jemals als Spielleitung erkannt und alle blieben für immer
// auf "warte auf die Spielleitung" hängen. In dem Fall gilt die Person, die
// zuerst beigetreten ist (players[0], nach joinedAt sortiert), als Ersatz.
function isHost(){
  if(cache.hostId) return cache.hostId === me.id;
  return cache.players.length > 0 && cache.players[0].id === me.id;
}
function hostName(){
  const h = cache.hostId ? cache.players.find(p=>p.id===cache.hostId) : cache.players[0];
  return h ? h.name : 'Spielleiter:in';
}

function unsubscribeAll(){
  unsubscribers.forEach(u=>u());
  unsubscribers = [];
}

// Bringt zurück zum Startbildschirm. Löscht dabei den eigenen Spieler-Eintrag
// aus Firestore (best effort) - sonst würde man als "Karteileiche" in der
// Spieleranzahl der Zurückbleibenden weiterzählen.
async function leaveRoom(){
  try{
    if(db && me.code){
      await deleteDoc(doc(playersCol(), me.id));
    }
  }catch(e){ /* Raum evtl. schon weg o.ä. - egal, wir verlassen ihn trotzdem lokal */ }
  clearStoredRoom();
  unsubscribeAll();
  joined = false;
  me.code = "";
  cache = { players: [], game: null, scores: {}, submissions: [], votes: [], hostId: null };
  render();
}

function subscribeToRoom(){
  unsubscribeAll();
  unsubscribers.push(onSnapshot(roomRef(), snap=>{
    const data = snap.data();
    cache.game = data ? data.game : null;
    cache.scores = data ? (data.scores || {}) : {};
    cache.hostId = data ? (data.hostId || null) : null;
    render();
  }, err=>{ errorMsg = "Verbindung verloren: " + err.message; render(); }));

  unsubscribers.push(onSnapshot(playersCol(), snap=>{
    cache.players = snap.docs
      .map(d=>({ id: d.id, ...d.data() }))
      .sort((a,b)=>{
        const ta = a.joinedAt && a.joinedAt.toMillis ? a.joinedAt.toMillis() : 0;
        const tb = b.joinedAt && b.joinedAt.toMillis ? b.joinedAt.toMillis() : 0;
        return ta - tb;
      });
    render();
  }));

  unsubscribers.push(onSnapshot(submissionsCol(), snap=>{
    cache.submissions = snap.docs.map(d=>d.data());
    render();
  }));

  unsubscribers.push(onSnapshot(votesCol(), snap=>{
    cache.votes = snap.docs.map(d=>d.data());
    render();
  }));
}

function countSubmissionsForRound(round){
  return cache.submissions.filter(s=>s.round===round).length;
}
function countVotesForRound(round){
  return cache.votes.filter(v=>v.round===round).length;
}

// ---------- Actions ----------
async function joinRoom(name, code){
  errorMsg = "";
  name = name.trim(); code = code.trim().toUpperCase();
  if(!name){ errorMsg = "Bitte gib deinen Namen ein."; render(); return; }
  if(!code || code.length<3){ errorMsg = "Bitte gib einen gültigen Raumcode ein."; render(); return; }
  me.name = name; me.code = code;

  try{
    await ensureAuth();
    await runTransaction(db, async (tx)=>{
      const snap = await tx.get(roomRef());
      if(!snap.exists()){
        tx.set(roomRef(), { game: initialGame(), scores: {}, hostId: me.id });
      }
    });
    await setDoc(doc(playersCol(), me.id), { name: me.name, joinedAt: new Date() });
  }catch(e){
    errorMsg = "Beitritt fehlgeschlagen: " + (e && e.message ? e.message : String(e));
    render();
    return;
  }

  saveStoredRoom(me.name, me.code);
  joined = true;
  subscribeToRoom();
  render();
}

function pickQuestionIndex(used, allowedCategories){
  const cats = (allowedCategories && allowedCategories.length) ? allowedCategories : CATEGORIES;
  const inCategory = QUESTIONS.map((_,i)=>i).filter(i=>cats.includes(questionCategory(QUESTIONS[i])));
  const free = inCategory.filter(i=>!used.includes(i));
  // Falls in den gewählten Kategorien schon alle Fragen dran waren, fängt
  // der Kategorie-Pool einfach wieder von vorne an, statt Fragen aus einer
  // nicht gewählten Kategorie zu nehmen.
  const pool = free.length ? free : inCategory;
  return pool[Math.floor(Math.random()*pool.length)];
}

function buildRoundPatch(qIndex){
  const q = QUESTIONS[qIndex];
  if(q.type === "truefalse"){
    const options = shuffle([
      { authorId: q.a ? "__CORRECT__" : "__WRONG__", text: "Wahr" },
      { authorId: q.a ? "__WRONG__" : "__CORRECT__", text: "Falsch" }
    ]);
    return { phase: "voting", questionIndex: qIndex, options };
  }
  return { phase: "writing", questionIndex: qIndex, options: null };
}

function beautifyText(text){
  let t = text.trim().replace(/\s+/g, ' ');
  if(t.length === 0) return t;
  t = t.charAt(0).toUpperCase() + t.slice(1);
  t = t.replace(/([.!?]\s+)([a-zäöüß])/g, (m,p1,p2)=>p1+p2.toUpperCase());
  t = t.replace(/([.!?]){2,}/g, '$1');
  t = t.replace(/\s+([,.!?])/g, '$1');
  if(!/[.!?]$/.test(t)) t += '.';
  return t;
}

async function startGame(rounds, categories){
  if(cache.players.length < 2) return;
  const totalRounds = (rounds && rounds > 0) ? rounds : 8;
  const cats = (categories && categories.length) ? categories : [...CATEGORIES];
  await transitionPhase('lobby', ()=>{
    const qIndex = pickQuestionIndex([], cats);
    const patch = buildRoundPatch(qIndex);
    return { game: { round:1, usedQuestions:[qIndex], totalRounds, categories: cats, tally:null, votes:null, correctIdx:null, ...patch } };
  });
}

// Löscht alle Dokumente einer Subcollection (in Batches von 500, dem
// Firestore-Limit pro Batch-Schreibvorgang).
async function clearCollection(colRef){
  const snap = await getDocs(colRef);
  if(snap.empty) return;
  const docs = snap.docs;
  for(let i=0; i<docs.length; i+=500){
    const batch = writeBatch(db);
    docs.slice(i, i+500).forEach(d=>batch.delete(d.ref));
    await batch.commit();
  }
}

async function resetGame(){
  // Alte Antworten/Stimmen müssen mitgelöscht werden - sonst würden bei einer
  // neuen Partie mit denselben Rundennummern (1, 2, 3, ...) die Karteileichen
  // aus der vorherigen Partie fälschlich mitgezählt werden.
  await Promise.all([
    clearCollection(submissionsCol()),
    clearCollection(votesCol())
  ]);
  await updateDoc(roomRef(), { game: initialGame(), scores: {} });
}

async function submitAnswer(text){
  const clean = beautifyText(text);
  if(!clean || !cache.game) return;
  const round = cache.game.round;
  await setDoc(doc(submissionsCol(), subDocId(round, me.id)), { round, pid: me.id, name: me.name, text: clean });
  localAnswerDraft = "";
  render();
}

async function goToVoting(){
  await transitionPhase('writing', (game)=>{
    const subs = cache.submissions
      .filter(s=>s.round===game.round)
      .map(s=>({ authorId: s.pid, text: s.text }));
    const q = QUESTIONS[game.questionIndex];
    const options = shuffle([{ authorId: "__CORRECT__", text: q.a }, ...subs]);
    return { game: { ...game, phase:"voting", options } };
  });
}

async function castVote(optionIdx){
  if(!cache.game) return;
  const round = cache.game.round;
  await setDoc(doc(votesCol(), subDocId(round, me.id)), { round, pid: me.id, optionIdx });
  render();
}

async function revealResults(){
  await transitionPhase('voting', (game, scores)=>{
    const round = game.round;
    const roundVotes = cache.votes.filter(v=>v.round===round);

    const tally = game.options.map(()=>0);
    roundVotes.forEach(v=>{ if(tally[v.optionIdx]!==undefined) tally[v.optionIdx]++; });

    const correctIdx = game.options.findIndex(o=>o.authorId==="__CORRECT__");
    const newScores = { ...scores };
    cache.players.forEach(p=>{ if(!(p.id in newScores)) newScores[p.id]=0; });

    const votesByPid = {};
    roundVotes.forEach(v=>{ votesByPid[v.pid] = v.optionIdx; });

    Object.entries(votesByPid).forEach(([pid, idx])=>{
      if(idx===correctIdx){ newScores[pid] = (newScores[pid]||0) + POINTS_CORRECT_GUESS; }
    });
    game.options.forEach((opt, idx)=>{
      const isRealAuthor = cache.players.some(p=>p.id===opt.authorId);
      if(isRealAuthor && idx!==correctIdx){
        const foolCount = roundVotes.filter(v=>v.optionIdx===idx).length;
        newScores[opt.authorId] = (newScores[opt.authorId]||0) + foolCount * POINTS_PER_FOOLED;
      }
    });

    return { scores: newScores, game: { ...game, phase:"reveal", tally, votes: votesByPid, correctIdx } };
  });
}

async function nextRound(){
  await transitionPhase('reveal', (game)=>{
    const qIndex = pickQuestionIndex(game.usedQuestions, game.categories);
    const patch = buildRoundPatch(qIndex);
    return { game: {
      ...game, round: game.round+1,
      usedQuestions:[...game.usedQuestions, qIndex],
      tally:null, votes:null, correctIdx:null, ...patch
    } };
  });
}

// ---------- Render ----------
function el(tag, props, ...children){
  const e = document.createElement(tag);
  if(props) Object.entries(props).forEach(([k,v])=>{
    if(k==="class") e.className = v;
    else if(k.startsWith("on") && typeof v==="function") e.addEventListener(k.slice(2), v);
    else if(v!==undefined && v!==null) e.setAttribute(k, v);
  });
  children.flat().forEach(c=>{
    if(c===null || c===undefined) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}

function renderBrand(){
  return el('div', {class:'brand'},
    el('div', {class:'mark'}, 'Bluff', el('span', {class:'accent'}, '-Partyspiel')),
    el('div', {class:'sub'}, 'Erfinde die Antwort. Erkenne die Wahrheit.')
  );
}

function renderJoinScreen(){
  const nameInput = el('input', {type:'text', placeholder:'z. B. Marie', value: me.name});
  nameInput.addEventListener('input', e=>{ me.name = e.target.value; });
  const codeInput = el('input', {type:'text', placeholder:'z. B. FXQK', value: me.code, style:'text-transform:uppercase; letter-spacing:.15em;'});
  codeInput.addEventListener('input', e=>{ me.code = e.target.value.toUpperCase(); });

  const joinBtn = el('button', {class:'primary', onclick: ()=>joinRoom(nameInput.value, codeInput.value)}, 'Raum beitreten');
  const createBtn = el('button', {class:'secondary', onclick: ()=>{ const c = makeCode(); codeInput.value = c; me.code = c; }}, 'Neuen Raumcode erzeugen');

  return el('div', null,
    renderBrand(),
    el('div', {class:'card'},
      el('label', null, 'Dein Name'),
      nameInput,
      el('label', null, 'Raumcode'),
      codeInput,
      el('div', {class:'error'}, errorMsg),
      el('div', {class:'row'}, joinBtn),
      el('div', {style:'height:8px'}),
      el('div', {class:'row'}, createBtn),
      el('div', {class:'hint'}, 'Eine Person erzeugt einen Raumcode und sagt ihn den anderen. Alle öffnen diese Seite auf ihrem Handy, geben Namen + denselben Code ein und tippen „Raum beitreten“.')
    ),
    el('div', {class:'install-hint'},
      'Tipp fürs Handy: Über das Teilen-Menü eures Browsers „Zum Home-Bildschirm hinzufügen“ wählen – dann startet die Seite wie eine App, direkt vom Icon aus.'
    )
  );
}

function renderTopbar(){
  const bar = el('div', {class:'topbar'},
    el('span', null, me.name),
    el('span', {class:'code'}, me.code)
  );
  const actions = [];
  // Verlassen darf jede Person jederzeit (betrifft nur einen selbst).
  actions.push(el('button', {
    class:'secondary',
    style:'width:auto; padding:8px 14px; font-size:12px;',
    onclick: ()=>{
      if(confirm('Raum verlassen und zurück zum Startbildschirm?')) leaveRoom();
    }
  }, 'Raum verlassen'));
  // Reset ist nur der Spielleitung erlaubt (sonst könnten mehrere Leute
  // gleichzeitig gegensätzliche Aktionen auslösen) und nur, solange
  // überhaupt eine Partie läuft - im Warteraum gibt es nichts zurückzusetzen.
  if(isHost() && cache.game && cache.game.phase !== 'lobby'){
    actions.push(el('button', {
      class:'danger',
      style:'width:auto; padding:8px 14px; font-size:12px;',
      onclick: ()=>{
        if(confirm('Spiel wirklich zurücksetzen? Alle Antworten, Stimmen und Punkte gehen verloren - alle kommen zurück in den Warteraum.')){
          resetGame();
        }
      }
    }, '↺ Spiel zurücksetzen'));
  }
  return [bar, el('div', {style:'display:flex; gap:8px; margin-bottom:14px;'}, ...actions)];
}

function renderPlayers(){
  return el('div', {class:'players'},
    cache.players.map(p=>el('div', {class:'chip'},
      el('div', {class:'avatar'}, initials(p.name)),
      el('span', null, p.name + (p.id===me.id ? ' (du)' : '') + (p.id===cache.hostId ? ' 👑' : ''))
    ))
  );
}

function renderLobby(){
  const enough = cache.players.length >= 2;

  // Rundenzahl und Kategorien legt nur die Spielleitung fest - alle anderen
  // sehen nur den Warteraum ohne diese Einstellungen.
  if(!isHost()){
    return el('div', null,
      ...renderTopbar(),
      el('div', {class:'card'},
        el('h2', null, 'Warteraum'),
        el('p', {class:'muted'}, 'Wartet, bis mindestens 2 Spieler:innen da sind. Jede Person schreibt und stimmt in jeder Runde mit – die App liest die Fragen vor.'),
        renderPlayers(),
        el('div', {class:'hint', style:'margin-top:10px'}, `${hostName()} wählt Rundenzahl und Kategorien und startet das Spiel, sobald genug Leute da sind.`)
      )
    );
  }

  const roundsRow = el('div', {class:'row'},
    ...[4,6,8].map(r=>el('button', {
      class: (lobbyRoundsDraft===r ? 'primary' : 'secondary') + ' round-btn',
      onclick: ()=>{ lobbyRoundsDraft = r; render(); }
    }, String(r)))
  );

  const catRow = el('div', {class:'players'},
    ...CATEGORIES.map(cat=>{
      const active = lobbyCategoriesDraft.includes(cat);
      const chip = el('div', {class:'chip selectable' + (active ? ' active' : '')}, cat);
      chip.addEventListener('click', ()=>{
        if(active){
          // mindestens eine Kategorie muss aktiv bleiben
          if(lobbyCategoriesDraft.length > 1){
            lobbyCategoriesDraft = lobbyCategoriesDraft.filter(c=>c!==cat);
          }
        } else {
          lobbyCategoriesDraft = [...lobbyCategoriesDraft, cat];
        }
        render();
      });
      return chip;
    })
  );

  return el('div', null,
    ...renderTopbar(),
    el('div', {class:'card'},
      el('h2', null, 'Warteraum'),
      el('p', {class:'muted'}, 'Wartet, bis mindestens 2 Spieler:innen da sind. Jede Person schreibt und stimmt in jeder Runde mit – die App liest die Fragen vor.'),
      renderPlayers(),
      el('div', {style:'height:10px'}),
      el('label', null, 'Rundenzahl'),
      roundsRow,
      el('div', {style:'height:14px'}),
      el('label', null, 'Kategorien (mindestens eine auswählen)'),
      catRow,
      el('div', {class:'hint', style:'margin:10px 0 12px'}, `Punkte: ${POINTS_CORRECT_GUESS} für die richtige Antwort erraten, ${POINTS_PER_FOOLED} für jede Person, die auf deine erfundene Antwort hereinfällt.`),
      el('button', {class:'primary', disabled: !enough ? 'true' : undefined,
        onclick: ()=>startGame(lobbyRoundsDraft, lobbyCategoriesDraft)
      }, enough ? 'Spiel starten' : `Noch ${2-cache.players.length} Spieler:in(nen) nötig`)
    )
  );
}

function renderWriting(){
  const game = cache.game;
  const q = QUESTIONS[game.questionIndex];
  const round = game.round;
  const n = countSubmissionsForRound(round);
  const total = cache.players.length;
  const mySubmission = cache.submissions.find(s=>s.round===round && s.pid===me.id);

  const roundLabel = game.totalRounds ? `Runde ${game.round} von ${game.totalRounds}` : `Runde ${game.round}`;
  const ta = el('textarea', {
    placeholder:'Denk dir eine möglichst überzeugende, aber erfundene Antwort aus …',
    spellcheck:'true', lang:'de', autocapitalize:'sentences', autocorrect:'on'
  });
  // Nach einem Neuladen der Seite (z.B. Handy hat den Tab neu geladen) ist
  // localAnswerDraft leer, obwohl die Antwort schon abgeschickt wurde -
  // deshalb hier die bereits gespeicherte Antwort ins Feld vorbefüllen,
  // statt eine scheinbar leere/verlorene Antwort zu zeigen.
  const startValue = localAnswerDraft || (mySubmission ? mySubmission.text : "");
  ta.value = startValue;
  ta.addEventListener('input', e=>{ localAnswerDraft = e.target.value; });

  const body = [
    el('div', {class:'muted'}, `${q.cat || 'Kuriosität'} · ${roundLabel}`),
    el('div', {class:'question'}, q.p),
    el('label', null, 'Deine erfundene Antwort'),
    ta,
    el('button', {class:'primary', onclick: async ()=>{ await submitAnswer(ta.value); } }, mySubmission ? 'Antwort aktualisieren' : 'Antwort abschicken'),
    mySubmission ? el('div', {class:'confirm'}, '✓ Antwort gesendet – du kannst sie noch ändern, solange die Runde läuft.') : null,
    el('div', {class:'hint'}, 'Die Rechtschreibprüfung deines Handys ist aktiv (rot unterstrichene Wörter antippen zum Korrigieren). Groß-/Kleinschreibung und Satzzeichen am Ende werden beim Abschicken zusätzlich automatisch angeglichen, damit Tippfehler nicht verraten, wer geschrieben hat.'),
    el('div', {class:'progress'}, `${n} von ${total} Antworten sind da.`),
    ...renderAdvanceControl(n, total, goToVoting, 'Weiter zur Abstimmung')
  ];

  const card = el('div', {class:'card'}, ...body);
  return el('div', null, renderTopbar(), card);
}

// Zeigt der Spielleitung einen "Weiter"-Button - der Button ist absichtlich
// NIE hart gesperrt, auch wenn die Zählung nicht exakt aufgeht (z.B. weil
// ein alter, inzwischen inaktiver Spieler-Eintrag aus einem früheren Test
// noch in der Datenbank mitzählt). Sonst könnte die Spielleitung für immer
// feststecken, wenn eine erwartete Antwort/Stimme nie kommt. Allen anderen
// zeigt es nur einen Hinweis, wer gerade weiterschaltet.
function renderAdvanceControl(n, total, onAdvance, label){
  const enough = n >= total;
  if(isHost()){
    return [el('button', {
      class:'primary', style:'margin-top:10px',
      onclick: onAdvance
    }, enough ? label : `${label} (${n} von ${total} fertig)`)];
  }
  return [el('div', {class:'hint', style:'margin-top:10px'},
    `${hostName()} kann jederzeit weitergehen (${n} von ${total} fertig).`
  )];
}

function renderVoting(){
  const game = cache.game;
  const q = QUESTIONS[game.questionIndex];
  const round = game.round;
  const myVote = cache.votes.find(v=>v.round===round && v.pid===me.id);
  const n = countVotesForRound(round);
  const total = cache.players.length;

  const optionEls = game.options.map((opt, idx)=>{
    const isMine = opt.authorId === me.id;
    const isSelected = myVote && myVote.optionIdx===idx;
    const card = el('div', {class:'option-card' + (isSelected?' selected':'')},
      el('div', {class:'option-text'}, opt.text),
      isMine ? el('div', {class:'option-meta'}, 'Das ist deine eigene Antwort') : null
    );
    if(!isMine && !myVote){
      card.addEventListener('click', ()=>castVote(idx));
    }
    return card;
  });

  const roundLabel = game.totalRounds ? `Runde ${game.round} von ${game.totalRounds}` : `Runde ${game.round}`;
  const body = [
    el('div', {class:'muted'}, `${q.cat || 'Kuriosität'} · ${roundLabel}`),
    el('div', {class:'question'}, q.p),
    ...optionEls,
    el('div', {class:'progress'}, myVote
      ? `${n} von ${total} Stimmen abgegeben.`
      : 'Tippe auf die Antwort, die du für die echte hältst.'),
    ...(myVote ? renderAdvanceControl(n, total, revealResults, 'Auflösung zeigen') : [])
  ];

  const card = el('div', {class:'card'}, ...body);
  return el('div', null, renderTopbar(), card);
}

function renderReveal(){
  const game = cache.game;

  const optionEls = game.options.map((opt, idx)=>{
    const isCorrect = idx === game.correctIdx;
    const votesFor = game.tally ? game.tally[idx] : 0;
    const author = cache.players.find(p=>p.id===opt.authorId) || null;
    const card = el('div', {class:'option-card ' + (isCorrect ? 'correct' : '')},
      el('div', {class:'stamp ' + (isCorrect?'wahr':'erfunden')}, isCorrect ? 'WAHR' : 'ERFUNDEN'),
      el('div', {class:'option-text'}, opt.text),
      el('div', {class:'option-meta'},
        isCorrect ? 'Richtige Antwort' : (author ? `Erfunden von ${author.name}` : 'Falsche Option'),
        ` · ${votesFor} Stimme(n)`
      )
    );
    return card;
  });

  const sorted = cache.players.slice().sort((a,b)=>(cache.scores[b.id]||0)-(cache.scores[a.id]||0));
  const scoreRows = sorted.map((p,i)=>el('div', {class:'scoreboard-row'},
    el('span', null, (i===0 ? '🏆 ' : '') + p.name + (p.id===me.id?' (du)':'')),
    el('span', {class:'pts'}, String(cache.scores[p.id]||0))
  ));

  const isFinalRound = game.totalRounds && game.round >= game.totalRounds;

  const body = [
    el('h3', null, 'Auflösung'),
    ...optionEls,
    el('div', {style:'height:6px'}),
    el('h3', null, isFinalRound ? 'Endstand' : 'Punktestand'),
    ...scoreRows
  ];

  if(isFinalRound){
    body.unshift(el('div', {class:'muted'}, `Letzte Runde (${game.round} von ${game.totalRounds}) gespielt 🎉`));
    body.push(el('button', {class:'primary', style:'margin-top:14px', onclick: resetGame}, 'Neues Spiel starten'));
  } else {
    body.push(el('button', {class:'primary', style:'margin-top:14px', onclick: nextRound}, 'Nächste Runde'));
  }

  return el('div', null, renderTopbar(), el('div', {class:'card'}, ...body));
}

function render(){
  root.innerHTML = "";
  if(!joined){
    root.appendChild(renderJoinScreen());
    return;
  }
  if(!cache.game || cache.game.phase === "lobby"){
    root.appendChild(renderLobby());
  } else if(cache.game.phase === "writing"){
    root.appendChild(renderWriting());
  } else if(cache.game.phase === "voting"){
    root.appendChild(renderVoting());
  } else if(cache.game.phase === "reveal"){
    root.appendChild(renderReveal());
  }
}

async function boot(){
  if(!isConfigured){
    root.appendChild(el('div', null,
      renderBrand(),
      el('div', {class:'card'},
        el('h2', null, 'Firebase noch nicht konfiguriert'),
        el('p', {class:'hint'}, 'Trage deine Firebase-Projektdaten oben im <script>-Tag dieser Datei ein (siehe README.md) und lade diese Seite danach neu.')
      )
    ));
    return;
  }

  const stored = loadStoredRoom();
  if(stored && stored.name && stored.code){
    me.name = stored.name;
    me.code = stored.code;
    try{
      await ensureAuth();
      await setDoc(doc(playersCol(), me.id), { name: me.name, joinedAt: new Date() }, { merge: true });
      joined = true;
      subscribeToRoom();
    }catch(e){
      clearStoredRoom();
      errorMsg = "Automatischer Wiedereinstieg fehlgeschlagen, bitte erneut beitreten.";
    }
  }
  render();
}

boot();
</script>
