// ---------- Storage helpers (Firebase Firestore als geteilter Speicher) ----------
// Jeder "key" wird als Dokument-ID in der Sammlung "kv" abgelegt.
// Der Parameter "shared" bleibt aus Kompatibilität zum bisherigen Code stehen,
// wird hier aber nicht mehr gebraucht: Firestore ist ohnehin für alle geteilt.
async function sGet(key, shared){
  try{
    const snap = await db.collection('kv').doc(key).get();
    return snap.exists ? snap.data().value : null;
  } catch(e){ console.error('sGet-Fehler:', e); return null; }
}
async function sSet(key, value, shared){
  try{
    await db.collection('kv').doc(key).set({ value: value, updatedAt: Date.now() });
    return true;
  } catch(e){ console.error('sSet-Fehler:', e); return null; }
}
async function sList(prefix, shared){
  try{
    const snap = await db.collection('kv')
      .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
      .where(firebase.firestore.FieldPath.documentId(), '<', prefix + '\uf8ff')
      .get();
    return snap.docs.map(d => d.id);
  } catch(e){ console.error('sList-Fehler:', e); return []; }
}

function uid(){ return Math.random().toString(36).slice(2,10); }
function makeCode(){
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  let c=""; for(let i=0;i<4;i++) c+=letters[Math.floor(Math.random()*letters.length)];
  return c;
}
function initials(name){
  return (name||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ---------- App state ----------
const root = document.getElementById('root');
let me = { id: uid(), name: "", code: "" };
let joined = false;
let pollTimer = null;
let localSelectedOption = null; // during voting, before vote is saved
let localAnswerDraft = "";
let errorMsg = "";
let lobbyRoundsDraft = 8;
let cache = { players: [], game: null, scores: {} };

function playersKey(){ return `room:${me.code}:players`; }
function gameKey(){ return `room:${me.code}:game`; }
function scoresKey(){ return `room:${me.code}:scores`; }
function subKey(round, pid){ return `room:${me.code}:sub:${round}:${pid}`; }
function subPrefix(round){ return `room:${me.code}:sub:${round}:`; }
function voteKey(round, pid){ return `room:${me.code}:vote:${round}:${pid}`; }
function votePrefix(round){ return `room:${me.code}:vote:${round}:`; }

async function refresh(){
  if(!joined) return;
  const [playersRaw, gameRaw, scoresRaw] = await Promise.all([
    sGet(playersKey(), true), sGet(gameKey(), true), sGet(scoresKey(), true)
  ]);
  cache.players = playersRaw ? JSON.parse(playersRaw) : [];
  cache.game = gameRaw ? JSON.parse(gameRaw) : null;
  cache.scores = scoresRaw ? JSON.parse(scoresRaw) : {};
  render();
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refresh, 2200);
}

// ---------- Actions ----------
async function joinRoom(name, code, isNew){
  errorMsg = "";
  name = name.trim(); code = code.trim().toUpperCase();
  if(!name){ errorMsg = "Bitte gib deinen Namen ein."; render(); return; }
  if(!code || code.length<3){ errorMsg = "Bitte gib einen gültigen Raumcode ein."; render(); return; }
  me.name = name; me.code = code;

  // Mehrere Personen können fast zeitgleich beitreten. Da die letzte
  // Schreibaktion gewinnt, könnte der eigene Eintrag sonst überschrieben
  // werden. Deshalb: schreiben, gegenprüfen, bei Bedarf wiederholen.
  let joinedSuccessfully = false;
  for(let attempt=0; attempt<6 && !joinedSuccessfully; attempt++){
    if(attempt>0) await new Promise(r=>setTimeout(r, 150 + Math.random()*300));
    let playersRaw = await sGet(playersKey(), true);
    let players = playersRaw ? JSON.parse(playersRaw) : [];
    if(!players.find(p=>p.id===me.id)){
      players.push({ id: me.id, name: me.name });
      await sSet(playersKey(), JSON.stringify(players), true);
    }
    const check = await sGet(playersKey(), true);
    const checkList = check ? JSON.parse(check) : [];
    joinedSuccessfully = !!checkList.find(p=>p.id===me.id);
  }
  if(!joinedSuccessfully){
    errorMsg = "Beitritt hat gerade nicht geklappt (zu viele gleichzeitige Beitritte). Bitte noch einmal auf „Raum beitreten“ tippen.";
    render();
    return;
  }

  let gameRaw = await sGet(gameKey(), true);
  if(!gameRaw){
    const game = { phase:"lobby", round:0, readerId:null, questionIndex:null, usedQuestions:[], options:null, totalRounds:null };
    await sSet(gameKey(), JSON.stringify(game), true);
  }
  let scoresRaw = await sGet(scoresKey(), true);
  if(!scoresRaw){
    await sSet(scoresKey(), JSON.stringify({}), true);
  }
  joined = true;
  startPolling();
  await refresh();
}

function pickQuestionIndex(used){
  const free = QUESTIONS.map((_,i)=>i).filter(i=>!used.includes(i));
  const pool = free.length ? free : QUESTIONS.map((_,i)=>i);
  return pool[Math.floor(Math.random()*pool.length)];
}

// Baut den Rundenzustand passend zum Fragetyp: normale Fragen starten bei
// "writing" (Antworten erfinden), Wahr/Falsch-Fragen springen direkt zur
// Abstimmung, weil dort nichts erfunden werden muss.
function buildRoundPatch(qIndex){
  const q = QUESTIONS[qIndex];
  if(q.type === "truefalse"){
    const options = shuffle([
      { authorId: q.a ? "__CORRECT__" : "__WRONG__", text: "Wahr" },
      { authorId: q.a ? "__WRONG__" : "__CORRECT__", text: "Falsch" }
    ]);
    return { phase: "voting", questionIndex: qIndex, options };
  }
  return { phase: "writing", questionIndex: qIndex, options: null };
}

// Leichte Rechtschreib-/Formatglättung: keine echte Fehlerkorrektur (dafür
// bräuchte es ein Wörterbuch), aber Groß-/Kleinschreibung, doppelte
// Leerzeichen und Satzzeichen werden vereinheitlicht, damit Tippfehler oder
// fehlende Punkte nicht verraten, wer eine Antwort geschrieben hat.
function beautifyText(text){
  let t = text.trim().replace(/\s+/g, ' ');
  if(t.length === 0) return t;
  t = t.charAt(0).toUpperCase() + t.slice(1);
  t = t.replace(/([.!?]\s+)([a-zäöüß])/g, (m,p1,p2)=>p1+p2.toUpperCase());
  t = t.replace(/([.!?]){2,}/g, '$1');
  t = t.replace(/\s+([,.!?])/g, '$1');
  if(!/[.!?]$/.test(t)) t += '.';
  return t;
}

async function startGame(rounds){
  const players = cache.players;
  if(players.length < 2) return;
  const totalRounds = (rounds && rounds > 0) ? rounds : 8;
  const qIndex = pickQuestionIndex([]);
  const patch = buildRoundPatch(qIndex);
  const game = {
    round:1, readerId: players[0].id, usedQuestions:[qIndex],
    totalRounds, tally:null, votes:null, correctIdx:null, ...patch
  };
  await sSet(gameKey(), JSON.stringify(game), true);
  await refresh();
}

async function resetGame(){
  const game = { phase:"lobby", round:0, readerId:null, questionIndex:null, usedQuestions:[], options:null, totalRounds:null };
  await sSet(gameKey(), JSON.stringify(game), true);
  await sSet(scoresKey(), JSON.stringify({}), true);
  await refresh();
}

async function submitAnswer(){
  const text = beautifyText(localAnswerDraft);
  if(!text) return;
  await sSet(subKey(cache.game.round, me.id), JSON.stringify({ name: me.name, text }), true);
  localAnswerDraft = "";
  await refresh();
}

async function countSubmissions(){
  const keys = await sList(subPrefix(cache.game.round), true);
  return keys.length;
}

async function goToVoting(){
  const game = cache.game;
  const keys = await sList(subPrefix(game.round), true);
  const subs = [];
  for(const k of keys){
    const raw = await sGet(k, true);
    if(raw){ const v = JSON.parse(raw); subs.push({ authorId: k.split(":").pop(), text: v.text }); }
  }
  const q = QUESTIONS[game.questionIndex];
  const options = shuffle([
    { authorId: "__CORRECT__", text: q.a },
    ...subs
  ]);
  const updated = { ...game, phase:"voting", options };
  await sSet(gameKey(), JSON.stringify(updated), true);
  await refresh();
}

async function castVote(optionIdx){
  await sSet(voteKey(cache.game.round, me.id), String(optionIdx), true);
  localSelectedOption = optionIdx;
  await refresh();
}

async function countVotes(){
  const keys = await sList(votePrefix(cache.game.round), true);
  return keys.length;
}

async function revealResults(){
  const game = cache.game;
  const keys = await sList(votePrefix(game.round), true);
  const votes = {};
  for(const k of keys){
    const pid = k.split(":").pop();
    const raw = await sGet(k, true);
    votes[pid] = raw !== null ? parseInt(raw,10) : null;
  }
  const tally = game.options.map(()=>0);
  Object.values(votes).forEach(idx=>{ if(idx!==null && tally[idx]!==undefined) tally[idx]++; });

  const correctIdx = game.options.findIndex(o=>o.authorId==="__CORRECT__");
  const scores = { ...cache.scores };
  cache.players.forEach(p=>{ if(!(p.id in scores)) scores[p.id]=0; });

  // Punkt fürs richtige Erraten
  Object.entries(votes).forEach(([pid, idx])=>{
    if(idx===correctIdx){ scores[pid] = (scores[pid]||0) + 1; }
  });
  // Punkt für jede Person, die auf eine erfundene Antwort hereingefallen ist
  // (bei Wahr/Falsch-Fragen gibt es keine erfundenen Antworten von Spielern,
  // daher nur werten, wenn die Option wirklich von jemandem stammt)
  game.options.forEach((opt, idx)=>{
    const isRealAuthor = cache.players.some(p=>p.id===opt.authorId);
    if(isRealAuthor && idx!==correctIdx){
      const foolCount = Object.values(votes).filter(v=>v===idx).length;
      scores[opt.authorId] = (scores[opt.authorId]||0) + foolCount;
    }
  });

  await sSet(scoresKey(), JSON.stringify(scores), true);
  const updated = { ...game, phase:"reveal", tally, votes, correctIdx };
  await sSet(gameKey(), JSON.stringify(updated), true);
  await refresh();
}

async function nextRound(){
  const game = cache.game;
  const players = cache.players;
  const curIdx = players.findIndex(p=>p.id===game.readerId);
  const nextReader = players[(curIdx+1) % players.length].id;
  const qIndex = pickQuestionIndex(game.usedQuestions);
  const patch = buildRoundPatch(qIndex);
  const updated = {
    ...game, round: game.round+1, readerId: nextReader,
    usedQuestions:[...game.usedQuestions, qIndex],
    tally:null, votes:null, correctIdx:null, ...patch
  };
  await sSet(gameKey(), JSON.stringify(updated), true);
  await refresh();
}

// ---------- Render ----------
function el(tag, props, ...children){
  const e = document.createElement(tag);
  if(props) Object.entries(props).forEach(([k,v])=>{
    if(k==="class") e.className = v;
    else if(k.startsWith("on") && typeof v==="function") e.addEventListener(k.slice(2), v);
    else if(v!==undefined && v!==null) e.setAttribute(k, v);
  });
  children.flat().forEach(c=>{
    if(c===null || c===undefined) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}

let connTestResult = "";
async function testConnection(){
  connTestResult = "Teste Firebase-Verbindung …";
  render();
  const steps = [];
  try{
    const testValue = "test-" + Date.now();
    const setResult = await sSet('verbindungstest', testValue, true);
    steps.push(`Schreiben: ${setResult ? 'ok ✓' : 'fehlgeschlagen ✗'}`);
    const readBack = await sGet('verbindungstest', true);
    steps.push(`Zurückgelesen: "${readBack}" ${readBack===testValue ? '(stimmt überein ✓)' : '(stimmt NICHT überein ✗)'}`);
  }catch(e){
    steps.push(`Fehler: ${e && e.message ? e.message : String(e)}`);
  }
  connTestResult = steps.join(' · ');
  render();
}

function renderJoinScreen(){
  const nameInput = el('input', {type:'text', placeholder:'z. B. Marie', value: me.name});
  nameInput.addEventListener('input', e=>{ me.name = e.target.value; });
  const codeInput = el('input', {type:'text', placeholder:'z. B. FXQK', value: me.code, style:'text-transform:uppercase; letter-spacing:.15em;'});
  codeInput.addEventListener('input', e=>{ me.code = e.target.value.toUpperCase(); });

  const joinBtn = el('button', {class:'primary', onclick: ()=>joinRoom(me.name, me.code, false)}, 'Raum beitreten');
  const createBtn = el('button', {class:'secondary', onclick: ()=>{ const c = makeCode(); codeInput.value = c; me.code = c; }}, 'Neuen Raumcode erzeugen');
  const testBtn = el('button', {class:'secondary', onclick: testConnection}, 'Verbindung testen (Diagnose)');

  return el('div', null,
    el('div', {class:'brand'},
      el('span', {class:'mark'}, 'Schwindelrunde'),
      el('span', {class:'sub'}, 'Bluff-Partyspiel')
    ),
    el('div', {class:'card'},
      el('label', null, 'Dein Name'),
      nameInput,
      el('label', null, 'Raumcode'),
      codeInput,
      el('div', {class:'error'}, errorMsg),
      el('div', {class:'row'}, joinBtn),
      el('div', {style:'height:8px'}),
      el('div', {class:'row'}, createBtn),
      el('div', {style:'height:8px'}),
      el('div', {class:'row'}, testBtn),
      connTestResult ? el('div', {class:'hint', style:'margin-top:10px'}, connTestResult) : null,
      el('div', {class:'hint'}, 'Eine Person erzeugt einen Raumcode und sagt ihn den anderen. Alle öffnen diese Seite auf ihrem Handy, geben Namen + denselben Code ein und tippen „Raum beitreten“.')
    ),
    el('div', {class:'install-hint'},
      'Tipp fürs Handy: Über das Teilen-Menü eures Browsers „Zum Home-Bildschirm hinzufügen“ wählen – dann startet die Seite wie eine App, direkt vom Icon aus.'
    )
  );
}

function renderTopbar(){
  return el('div', {class:'topbar'},
    el('span', null, me.name),
    el('span', {class:'code'}, me.code)
  );
}

function renderPlayers(){
  return el('div', {class:'players'},
    cache.players.map(p=>el('div', {class:'chip'},
      el('div', {class:'avatar'}, initials(p.name)),
      el('span', null, p.name + (p.id===me.id ? ' (du)' : ''))
    ))
  );
}

function renderLobby(){
  const enough = cache.players.length >= 2;
  const roundsInput = el('input', {type:'text', inputmode:'numeric', placeholder:'z. B. 8'});
  roundsInput.value = String(lobbyRoundsDraft);
  roundsInput.addEventListener('input', e=>{
    const digits = e.target.value.replace(/[^0-9]/g,'');
    lobbyRoundsDraft = digits ? parseInt(digits,10) : '';
  });
  return el('div', null,
    renderTopbar(),
    el('div', {class:'card'},
      el('h2', null, 'Warteraum'),
      el('p', {class:'muted'}, 'Wartet, bis mindestens 2 Spieler:innen da sind, dann kann jede:r starten. (Vorübergehend zum Testen abgesenkt – für die richtige Bluff-Dynamik sind später 3+ empfehlenswert.)'),
      renderPlayers(),
      el('div', {style:'height:10px'}),
      el('label', null, 'Rundenzahl'),
      roundsInput,
      el('div', {class:'hint', style:'margin-bottom:12px'}, 'Jede Person kommt so oft als Vorleser:in dran, bis diese Rundenzahl erreicht ist.'),
      el('button', {class:'primary', disabled: !enough ? 'true' : undefined,
        onclick: ()=>startGame(lobbyRoundsDraft && lobbyRoundsDraft>0 ? lobbyRoundsDraft : 8)
      }, enough ? 'Spiel starten' : `Noch ${2-cache.players.length} Spieler:in(nen) nötig`)
    )
  );
}

function renderWriting(){
  const game = cache.game;
  const q = QUESTIONS[game.questionIndex];
  const iAmReader = game.readerId === me.id;
  const readerName = (cache.players.find(p=>p.id===game.readerId)||{}).name || '?';

  const roundLabel = game.totalRounds ? `Runde ${game.round} von ${game.totalRounds}` : `Runde ${game.round}`;
  const body = [
    el('div', {class:'muted'}, `${q.cat || 'Kuriosität'} · ${roundLabel} · Vorleser:in: ${readerName}`),
    el('div', {class:'question'}, q.p)
  ];

  if(iAmReader){
    body.push(
      el('div', {class:'answer-reveal'}, el('b', null, 'Echte Antwort (nur du siehst das): '), q.a),
      el('div', {class:'progress', id:'sub-progress'}, 'Warte auf Antworten der anderen …'),
      el('button', {class:'primary', style:'margin-top:14px', onclick: goToVoting}, 'Zur Abstimmung wechseln')
    );
  } else {
    const ta = el('textarea', {
      placeholder:'Denk dir eine möglichst überzeugende, aber erfundene Antwort aus …',
      spellcheck:'true', lang:'de', autocapitalize:'sentences', autocorrect:'on'
    });
    ta.value = localAnswerDraft;
    ta.addEventListener('input', e=>{ localAnswerDraft = e.target.value; });
    body.push(
      el('label', null, 'Deine erfundene Antwort'),
      ta,
      el('button', {class:'primary', onclick: async ()=>{ localAnswerDraft = ta.value; await submitAnswer(); } }, 'Antwort abschicken'),
      el('div', {class:'hint'}, 'Die Rechtschreibprüfung deines Handys ist aktiv (rot unterstrichene Wörter antippen zum Korrigieren). Groß-/Kleinschreibung und Satzzeichen am Ende werden beim Abschicken zusätzlich automatisch angeglichen, damit Tippfehler nicht verraten, wer geschrieben hat.')
    );
  }

  const card = el('div', {class:'card'}, ...body);
  const wrap = el('div', null, renderTopbar(), card);

  // Fortschritt asynchron nachladen (nicht blockierend)
  countSubmissions().then(n=>{
    const nonReaderCount = cache.players.length - 1;
    const progEl = card.querySelector('#sub-progress');
    if(progEl) progEl.textContent = `${n} von ${nonReaderCount} Antworten sind da.`;
    if(!iAmReader){
      const already = cache.players.length; // no-op guard
    }
  });

  return wrap;
}

function renderVoting(){
  const game = cache.game;
  const iAmReader = game.readerId === me.id;
  const readerName = (cache.players.find(p=>p.id===game.readerId)||{}).name || '?';
  const q = QUESTIONS[game.questionIndex];

  const optionEls = game.options.map((opt, idx)=>{
    const isMine = opt.authorId === me.id;
    const card = el('div', {class:'option-card' + (localSelectedOption===idx?' selected':'')},
      el('div', {class:'option-text'}, opt.text),
      isMine ? el('div', {class:'option-meta'}, 'Das ist deine eigene Antwort') : null
    );
    if(!iAmReader && !isMine){
      card.addEventListener('click', ()=>castVote(idx));
    }
    return card;
  });

  const roundLabel = game.totalRounds ? `Runde ${game.round} von ${game.totalRounds}` : `Runde ${game.round}`;
  const body = [
    el('div', {class:'muted'}, `${q.cat || 'Kuriosität'} · ${roundLabel} · Vorleser:in: ${readerName}`),
    el('div', {class:'question'}, q.p),
    ...optionEls
  ];

  if(iAmReader){
    body.push(
      el('div', {class:'progress', id:'vote-progress'}, 'Warte auf die Stimmen …'),
      el('button', {class:'primary', style:'margin-top:10px', onclick: revealResults}, 'Ergebnis zeigen')
    );
  } else {
    body.push(el('div', {class:'hint'}, 'Tippe auf die Antwort, die du für die echte hältst.'));
  }

  const card = el('div', {class:'card'}, ...body);
  const wrap = el('div', null, renderTopbar(), card);

  countVotes().then(n=>{
    const votersExpected = cache.players.length - 1;
    const progEl = card.querySelector('#vote-progress');
    if(progEl) progEl.textContent = `${n} von ${votersExpected} Stimmen abgegeben.`;
  });

  return wrap;
}

function renderReveal(){
  const game = cache.game;
  const iAmReader = game.readerId === me.id;

  const optionEls = game.options.map((opt, idx)=>{
    const isCorrect = idx === game.correctIdx;
    const votesFor = game.tally ? game.tally[idx] : 0;
    const author = cache.players.find(p=>p.id===opt.authorId) || null;
    const card = el('div', {class:'option-card ' + (isCorrect ? 'correct' : '')},
      el('div', {class:'stamp ' + (isCorrect?'wahr':'erfunden')}, isCorrect ? 'WAHR' : 'ERFUNDEN'),
      el('div', {class:'option-text'}, opt.text),
      el('div', {class:'option-meta'},
        isCorrect ? 'Richtige Antwort' : (author ? `Erfunden von ${author.name}` : 'Falsche Option'),
        ` · ${votesFor} Stimme(n)`
      )
    );
    return card;
  });

  const sorted = cache.players.slice().sort((a,b)=>(cache.scores[b.id]||0)-(cache.scores[a.id]||0));
  const scoreRows = sorted.map((p,i)=>el('div', {class:'scoreboard-row'},
    el('span', null, (i===0 ? '🏆 ' : '') + p.name + (p.id===me.id?' (du)':'')),
    el('span', {class:'pts'}, String(cache.scores[p.id]||0))
  ));

  const isFinalRound = game.totalRounds && game.round >= game.totalRounds;

  const body = [
    el('h3', null, 'Auflösung'),
    ...optionEls,
    el('div', {style:'height:6px'}),
    el('h3', null, isFinalRound ? 'Endstand' : 'Punktestand'),
    ...scoreRows
  ];

  if(isFinalRound){
    body.unshift(el('div', {class:'muted'}, `Letzte Runde (${game.round} von ${game.totalRounds}) gespielt 🎉`));
    if(iAmReader){
      body.push(el('button', {class:'primary', style:'margin-top:14px', onclick: resetGame}, 'Neues Spiel starten'));
    } else {
      body.push(el('div', {class:'hint', style:'margin-top:10px'}, `Warte, bis ${(cache.players.find(p=>p.id===game.readerId)||{}).name} ein neues Spiel startet.`));
    }
  } else if(iAmReader){
    body.push(el('button', {class:'primary', style:'margin-top:14px', onclick: nextRound}, 'Nächste Runde'));
  } else {
    body.push(el('div', {class:'hint', style:'margin-top:10px'}, `Warte, bis ${(cache.players.find(p=>p.id===game.readerId)||{}).name} die nächste Runde startet.`));
  }

  return el('div', null, renderTopbar(), el('div', {class:'card'}, ...body));
}

function render(){
  root.innerHTML = "";
  if(!joined){
    root.appendChild(renderJoinScreen());
    return;
  }
  if(!cache.game || cache.game.phase === "lobby"){
    root.appendChild(renderLobby());
  } else if(cache.game.phase === "writing"){
    root.appendChild(renderWriting());
  } else if(cache.game.phase === "voting"){
    root.appendChild(renderVoting());
  } else if(cache.game.phase === "reveal"){
    root.appendChild(renderReveal());
  }
}

render();
</script>
